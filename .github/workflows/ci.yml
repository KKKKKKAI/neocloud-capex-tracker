name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is part of the deploy contract: the server only deploys a
  # commit whose "lint-and-test" check run succeeded. Don't rename it.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fetch,read,extract,export,charts,server]" cfn-lint

      - name: Lint
        run: |
          ruff check src tests scripts deploy
          cfn-lint deploy/aws/*.yaml
          shellcheck deploy/*.sh deploy/aws/*.sh scripts/*.sh

      - name: Test
        run: |
          pytest -q
