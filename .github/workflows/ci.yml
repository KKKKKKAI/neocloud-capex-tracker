name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is part of the deploy contract: the server only deploys a
  # commit whose "lint-and-test" check run succeeded. Don't rename it.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python 3.12
        # setup-uv publishes no floating major tags: pin a release.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      # The same locked versions the server installs (plus the dev tools).
      - name: Install from uv.lock
        run: |
          uv lock --check
          uv sync --frozen --all-extras

      - name: Lint
        run: |
          uv run ruff check src tests scripts deploy
          uvx cfn-lint deploy/aws/*.yaml
          shellcheck deploy/*.sh deploy/aws/*.sh scripts/*.sh

      - name: Test
        run: uv run pytest -q
