name: Calendar sync

# Weekly Alpha Vantage refresh of fiscal_calendar. The LLM-heavy filing
# watcher runs on the maintainer's WSL cron (uses Claude Code Pro Max
# auth via `claude -p`), not in CI. This workflow is the cheap, no-LLM
# half: keep the calendar table fresh even if the local machine is off.
#
# Single-writer guarantee on the workbook is enforced by the concurrency group.

on:
  schedule:
    # Sundays at 13:30 UTC — well outside any earnings-day window.
    - cron: "30 13 * * 0"
  workflow_dispatch: {}

concurrency:
  group: workbook-write
  cancel-in-progress: false

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Sync earnings calendar from Alpha Vantage
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          PYTHONPATH=src python -m capex.monitor.calendar

      - name: Commit calendar changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/db/capex.db data/db/dump.sql || true
          if ! git diff --staged --quiet; then
            git commit -m "data(calendar): weekly Alpha Vantage sync"
            git push
          else
            echo "no calendar changes."
          fi
