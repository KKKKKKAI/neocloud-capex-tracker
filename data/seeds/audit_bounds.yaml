# Plausible value ranges per (ticker, metric, period_type) for the
# `check_range` audit check. All values in USD millions.
#
# Keys for period_type groups:
#   FY            — full fiscal year (12 months)
#   Q1_Q2_Q3_Q4   — any 3-month standalone quarter
#   H1            — 6-month YTD
#   9M            — 9-month YTD
#
# Bounds are indicative (upper-bound-of-normal × ~1.2-1.5 safety margin).
# A legitimate breach (e.g. a genuine record quarter, a restatement
# spike) should update the YAML rather than silence the check.
#
# Initial values derived from the DB snapshot at audit-build time.

defaults:
  revenue:
    FY:            [20, 800000]
    Q1_Q2_Q3_Q4:   [5, 250000]
    H1:            [10, 500000]
    9M:            [15, 700000]
  capital_expenditures:
    FY:            [1, 250000]
    Q1_Q2_Q3_Q4:   [0, 75000]
    H1:            [0, 150000]
    9M:            [0, 200000]
  operating_cash_flow:
    FY:            [-5000, 250000]
    Q1_Q2_Q3_Q4:   [-2000, 80000]
    H1:            [-3000, 150000]
    9M:            [-4000, 200000]
  depreciation_amortization:
    FY:            [1, 100000]
    Q1_Q2_Q3_Q4:   [0, 30000]
  property_plant_equipment_net:
    FY:            [1, 700000]
    Q1_Q2_Q3_Q4:   [1, 700000]
  cloud_segment_revenue:
    FY:            [1, 250000]
    Q1_Q2_Q3_Q4:   [0, 70000]
    H1:            [0, 130000]
    9M:            [0, 200000]

