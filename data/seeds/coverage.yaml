  "0700":
    full_name: Tencent Holdings Limited
    category: chinese_hyperscaler
    reporting_currency: CNY
    coverage_start: "2015-01-01"
    filing_cadence:
      annual: HK-AR
      quarterly: null  # HK-IR is semi-annual only; voluntary quarterly press releases
    extraction_approach: llm_primary
    quarterly_convention:
      default: semi_annual   # HKEX interim report only, no 3-month quarterly
