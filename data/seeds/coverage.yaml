# ===================================================================
# DATASET TREATMENTS
# ===================================================================
#
# Each dataset defines: what metric is tracked, which companies are
# included, and what treatment each company needs. When adding a new
# dataset, copy this structure and fill in the per-company treatments.

datasets:

  headline_financials:
    description: >
      Core financial statement items: revenue, capex, operating cash
      flow, depreciation & amortization, PP&E. Extracted from the
      primary financial statements (income statement, cash flow
      statement, balance sheet).
    metric_keys:
      - capital_expenditures
      - revenue
      - operating_cash_flow
      - depreciation_amortization
      - property_plant_equipment_net
    coverage_start: "2015-01-01"
    cadence: quarterly (where available; annual for 20-F filers)
    extraction_method: xbrl_primary  # XBRL companyfacts for all SEC filers
    companies_included:
      - MSFT
      - AMZN
      - GOOGL
      - META
      - ORCL
      - BABA
      - BIDU
      - GDS
      - "0700"
      - CRWV
      - APLD
      - IREN
      - NBIS
    companies_excluded: []
    notes: |
      All 13 companies included. XBRL companyfacts provides quarterly
      time series for SEC filers back to ~2009 in one API call. Non-USD
      companies (BABA, BIDU, GDS, 0700) require FX conversion at
      period-end rate. 20-F filers (BABA, BIDU, GDS, IREN, NBIS) have
      annual data only; quarterly granularity not available from SEC.

  cloud_segment_revenue:
    description: >
      Revenue specifically from cloud computing / datacenter
      operations. For hyperscalers with named segments, this is the
      segment revenue (e.g. MSFT "Intelligent Cloud", AMZN "AWS").
      For pure-play neoclouds, total revenue serves as the proxy.
    metric_keys:
      - cloud_segment_revenue
    coverage_start: "2015-01-01"
    cadence: quarterly (where available)
    extraction_method: hybrid  # XBRL first, LLM fallback for fuzzy segments
    companies_included:
      - ticker: MSFT
        treatment: named_segment
        segment_names: ["Intelligent Cloud", "Commercial Cloud"]
        segment_start: "2015-07-01"  # first segment disclosure
        notes: "Renamed from Commercial Cloud to Intelligent Cloud ~FY2018"

      - ticker: AMZN
        treatment: named_segment
        segment_names: ["AWS", "Amazon Web Services"]
        segment_start: "2015-01-01"
        notes: "Clean segment since Q1 2015"

      - ticker: GOOGL
        treatment: named_segment
        segment_names: ["Google Cloud"]
        segment_start: "2020-10-01"  # Q4 2020 first segment disclosure
        adjustment:
          pre_segment_treatment: null  # no derivation possible pre-2020
          rationale: |
            Google Cloud was first reported as a separate segment in Q4 2020
            (FY2020 10-K). Before that, cloud revenue was part of the
            undifferentiated "Google" segment. No subsidiary or line-item
            subtraction is available to derive pre-2020 cloud revenue.
            Google did disclose cloud annualized run-rate in some press
            releases/earnings calls (~$8B run-rate in Q4 2019) but these
            are not from 10-K filings and are not comparable to the
            segment disclosure.
          caveats:
            - "Pre-Q4 2020 cloud revenue is null — not derivable from 10-K"
            - "Press release/earnings call disclosures could fill this gap but require a different source"
        notes: "Segment data from FY2020 onward only."

      - ticker: ORCL
        treatment: named_segment
        segment_names: ["Cloud Services and License Support", "Cloud Services", "Cloud"]
        segment_start: "2015-06-01"
        notes: "Segment name changed multiple times. LLM judgment may be needed."

      - ticker: BABA
        treatment: named_segment
        segment_names: ["Cloud Intelligence Group", "Cloud Computing"]
        segment_start: "2016-04-01"
        notes: |
          Renamed "Cloud Computing" → "Cloud Intelligence Group" in FY2024.
          CNY reporting. Quarterly values come from 6-K press releases
          (standalone, Apr-Jun / Jul-Sep / Oct-Dec); fiscal Q4 (=
          calendar Q1 of the next calendar year) is not disclosed
          quarterly and is reconcile-derived from the 20-F:
             Q4 = FY − Q1 − Q2 − Q3
          See top-level BABA company notes for the full fiscal-quarter
          convention.

      - ticker: BIDU
        treatment: derived_subtraction
        segment_names: ["AI Cloud", "Baidu Cloud"]
        segment_start: "2018-01-01"
        adjustment:
          method: subtraction
          formula: "cloud_revenue = Others_revenue - iQIYI_standalone_revenue"
          rationale: |
            Baidu does not separately disclose cloud revenue. Their revenue
            is split into "Online marketing services" and "Others". The
            "Others" category includes: (1) cloud services, (2) iQIYI
            video membership and advertising, and (3) other services.
            iQIYI (NASDAQ: IQ) is a separately listed subsidiary that
            reports standalone revenue. By subtracting iQIYI's standalone
            revenue from Baidu's "Others" revenue, we approximate Baidu's
            cloud + other non-iQIYI services revenue. This overstates
            cloud slightly (includes some non-cloud items) but is the
            closest available proxy without management commentary.
          source_line_items:
            - "Others revenue (from Baidu 20-F income statement)"
            - "iQIYI standalone revenue (from iQIYI 20-F or Baidu 20-F segment note)"
          caveats:
            - "Overstates cloud: includes non-cloud items in Others beyond iQIYI"
            - "iQIYI was deconsolidated in 2025; adjustment formula changes post-deconsolidation"
            - "Values in RMB, converted to USD at period-end FX rate"
        notes: "CNY. Annual only (20-F)."

      - ticker: "0700"
        treatment: named_segment_fuzzy
        segment_names: ["金融科技及企業服務", "FinTech and Business Services"]
        segment_start: "2019-01-01"
        extraction_method: pdf_pdfplumber
        adjustment:
          method: proxy_segment
          formula: "cloud_proxy = FinTech_and_Business_Services_segment_revenue"
          rationale: |
            Tencent does not separately disclose cloud revenue. Their
            "金融科技及企業服務" (FinTech and Business Services) segment
            includes: (1) cloud services (Tencent Cloud), (2) payment
            services (WeChat Pay — the MAJORITY of the segment), and
            (3) enterprise SaaS. Using the full segment as a cloud proxy
            overstates cloud revenue by approximately 2-3x. No subtraction
            method is available because there is no separately listed
            subsidiary or sub-segment to net out.
          source_line_items:
            - "金融科技及企業服務 segment revenue (from HKEX annual report, page 9 or segment note)"
          caveats:
            - "OVERSTATES cloud by ~2-3x: includes WeChat Pay payment processing"
            - "Tencent Cloud is estimated at ~30-40% of the segment by industry analysts"
            - "Filing is in Chinese (Traditional); English version published separately"
            - "Values in RMB, converted to USD at period-end FX rate"
            - "Only HK-AR and HK-IR available (no 10-Q quarterly)"
        notes: "CNY. HKEX PDF extraction via pdfplumber. Annual + H1 only."

      - ticker: GDS
        treatment: whole_company
        notes: "Pure-play datacenter. Total revenue = cloud/DC revenue. CNY."

      - ticker: CRWV
        treatment: whole_company
        notes: "Pure-play GPU cloud. Total revenue = cloud revenue. IPO Mar 2025."

      - ticker: APLD
        treatment: whole_company
        notes: "Pure-play HPC/datacenter. Total revenue = DC revenue post-2022 pivot."

      - ticker: IREN
        treatment: whole_company
        notes: "Datacenter/mining. Total revenue. USD. Annual only."

      - ticker: NBIS
        treatment: whole_company
        notes: "AI infra. Total revenue. Very limited history (FY2024 only)."

    companies_excluded:
      - ticker: META
        reason: >
          Meta is an AI infrastructure buyer, not a cloud vendor. They
          do not sell cloud services and have no cloud segment revenue.
          Tracked for headline metrics (capex, total revenue) only.


# ===================================================================
# METHODOLOGY NOTES
# ===================================================================
#
# These notes apply across all datasets and companies.

methodology:

  xbrl_primary:
    description: >
      For SEC filers with clean XBRL tagging, pull the full quarterly
      time series from data.sec.gov/api/xbrl/companyfacts/ in one API
      call. No filing download needed. Values are in the company's
      reporting currency (USD or CNY). FX conversion applied at
      period-end rate via frankfurter.app.
    when_to_use: >
      Use for headline financial metrics (revenue, capex, OCF, D&A,
      PP&E) and for segment revenue when the company XBRL-tags its
      segments (most US hyperscalers do since ~2018).
    limitations: >
      XBRL concept names vary across companies (e.g. "Revenues" vs
      "RevenueFromContractWithCustomerExcludingAssessedTax"). Some
      concepts are missing for some periods. Foreign filers (20-F)
      may use IFRS taxonomy instead of US-GAAP. Segment-level XBRL
      tagging is inconsistent — check each company individually.

  llm_primary:
    description: >
      For companies where XBRL data is incomplete, inconsistent, or
      absent (especially Chinese names with changing segment
      definitions), read the actual filing sections and extract via
      LLM with judgment. Requires the filing to be in the archive
      (data/_sources/).
    when_to_use: >
      Use for: (1) segment revenue on Chinese hyperscalers where XBRL
      segment tagging is sparse, (2) AI-attributable capex isolation
      (future), (3) any metric that requires reading narrative prose.
    limitations: >
      Interactive-only in v1 (requires Claude Code session). Each
      extraction is one filing at a time. Cost scales with number of
      filings × number of metrics.

  hybrid:
    description: >
      XBRL first, LLM fallback. Try the companyfacts API; if the
      data is there and looks clean, use it. If not (missing concept,
      wrong value, no segment tagging), fall back to LLM extraction
      from the actual filing.
    when_to_use: >
      Default for new datasets. Gets 80%+ coverage from XBRL (free,
      fast) and reserves LLM for the 20% that genuinely needs
      judgment.

  fx_treatment:
    description: >
      All values stored in BOTH local reporting currency (value) and
      USD (value_usd). FX rate sourced from frankfurter.app (ECB data)
      as of the period_of_report end date. Rate + date stored
      alongside the value for full auditability.
    affected_companies: [BABA, BIDU, GDS, "0700"]

  whole_company_treatment:
    description: >
      For pure-play neoclouds (GDS, CRWV, APLD, IREN, NBIS), the
      company's total revenue IS the cloud/datacenter revenue. No
      segment extraction needed — the headline revenue figure is used
      directly as cloud_segment_revenue.
