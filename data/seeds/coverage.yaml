# Coverage Treatment Configuration
#
# THE central reference for how each company is tracked. This file
# defines: what data sources are used, what currency treatments apply,
# what segment names to look for, when coverage starts, and what
# special handling is needed for each company's financial statements.
#
# WHEN TO USE THIS FILE:
# - Adding a new company to the tracker → add an entry here first
# - Processing a new quarterly report → check this file for the
#   company's treatments (segment names, currency, special notes)
# - Building a new dataset → define it in the datasets section,
#   map each company to its treatment for that dataset
# - Debugging an extraction → this file tells you what the expected
#   source, segment name, and currency should be
#
# DESIGN PRINCIPLE: "download once, extract many"
# Quarterly filings are downloaded to data/_sources/ once and form a
# permanent archive. Each new metric or dataset is extracted by
# traversing the existing archive — no re-downloading needed. This
# makes the archive design load-bearing: get it right before pulling.

# ===================================================================
# COMPANY TREATMENTS
# ===================================================================
#
# Per-company configuration that applies across ALL datasets.
# Extends _identity.yaml (which has ticker, CIK, FYE, preferred_source)
# with extraction-specific treatments.

companies:

  MSFT:
    full_name: Microsoft Corporation
    category: hyperscaler
    reporting_currency: USD
    coverage_start: "2015-07-01"  # FY2016 Q1 (FYE June)
    filing_cadence:
      annual: 10-K
      quarterly: 10-Q
    extraction_approach: xbrl_primary  # XBRL for headline metrics, LLM for segments
    quarterly_convention:
      default: three_month_column   # 10-Q exposes explicit 3M and YTD columns
      filing_header_signatures:
        expect_any_of:
          - "Three Months Ended"
          - "Six Months Ended"
          - "Nine Months Ended"
    notes: |
      Microsoft's fiscal year ends in June. FY2016 started July 2015.
      Segment reporting changed in FY2018 — "Commercial Cloud" became
      "Intelligent Cloud". Prior to FY2016, cloud revenue was not
      separately reported as a segment.

  AMZN:
    full_name: Amazon.com, Inc.
    category: hyperscaler
    reporting_currency: USD
    coverage_start: "2015-01-01"  # FY2015 Q1 (FYE December)
    filing_cadence:
      annual: 10-K
      quarterly: 10-Q
    extraction_approach: xbrl_primary
    quarterly_convention:
      default: three_month_column
      filing_header_signatures:
        expect_any_of:
          - "Three Months Ended"
          - "Six Months Ended"
          - "Nine Months Ended"
    notes: |
      AWS has been reported as a separate segment since Q1 2015 (first
      quarterly segment disclosure in the 10-Q for Q1 2015). Clean
      segment data throughout the coverage period.

  GOOGL:
    full_name: Alphabet Inc.
    category: hyperscaler
    reporting_currency: USD
    coverage_start: "2015-01-01"
    filing_cadence:
      annual: 10-K
      quarterly: 10-Q
    extraction_approach: xbrl_primary
    quarterly_convention:
      default: three_month_column
      filing_header_signatures:
        expect_any_of:
          - "Three Months Ended"
          - "Six Months Ended"
          - "Nine Months Ended"
    notes: |
      Google Cloud was first reported as a separate segment in Q4 2020
      (10-K for FY2020). Before that, cloud revenue was bundled into
      "Other Bets" or not separately disclosed. Coverage for cloud
      segment revenue starts Q4 2020; prior quarters show null.

  META:
    full_name: Meta Platforms, Inc.
    category: hyperscaler
    reporting_currency: USD
    coverage_start: "2015-01-01"
    filing_cadence:
      annual: 10-K
      quarterly: 10-Q
    extraction_approach: xbrl_primary
    quarterly_convention:
      default: three_month_column
      filing_header_signatures:
        expect_any_of:
          - "Three Months Ended"
          - "Six Months Ended"
          - "Nine Months Ended"
    notes: |
      Meta is an AI infrastructure BUYER, not a cloud vendor. They do
      not sell cloud services and have no "cloud segment revenue."
      Tracked for headline metrics (total capex, revenue) only.
      Excluded from the cloud_segment_revenue dataset.

  ORCL:
    full_name: Oracle Corporation
    category: hyperscaler
    reporting_currency: USD
    coverage_start: "2015-06-01"  # FY2016 Q1 (FYE May)
    filing_cadence:
      annual: 10-K
      quarterly: 10-Q
    extraction_approach: xbrl_primary
    quarterly_convention:
      default: three_month_column
      filing_header_signatures:
        expect_any_of:
          - "Three Months Ended"
          - "Six Months Ended"
          - "Nine Months Ended"
    notes: |
      Oracle's fiscal year ends in May. Cloud segment naming has changed
      multiple times: "Cloud Software", "Cloud Services and License
      Support", "Cloud". The cloud-related segment may need LLM judgment
      to correctly identify across different reporting periods.
      Oracle acquired Cerner in 2022, which significantly affected
      revenue composition.

  BABA:
    full_name: Alibaba Group Holding Limited
    category: chinese_hyperscaler
    reporting_currency: CNY
    coverage_start: "2015-04-01"  # FY2016 Q1 (FYE March)
    filing_cadence:
      annual: 20-F
      quarterly: null  # 20-F filers don't file 10-Q; 6-K has quarterly press releases
    extraction_approach: llm_primary  # IFRS reporting, segment names change
    quarterly_convention:
      default: standalone_quarterly   # 6-K press releases report 3-month values directly
      filing_header_signatures:
        expect_any_of:
          - "quarter ended"
          - "In the quarter ended"
          - "Three months ended"
        must_not_match:
          - "Nine months ended"   # YTD phrasing would conflict with standalone
    notes: |
      Alibaba's fiscal year ends in March. Reports in RMB/CNY under
      IFRS. Files 20-F annually on SEC (preferred) and HK-AR on HKEX.
      Cloud segment renamed from "Cloud Computing" to "Cloud
      Intelligence Group" in FY2024. Quarterly data only available from
      6-K press releases or HKEX interim reports — limited granularity.
      FX conversion required: CNY → USD at period-end rate.
      IMPORTANT: 6-K quarterly values are STANDALONE (not cumulative
      YTD like 10-Q). Do NOT apply de-cumulation to 6-K data.

      FISCAL-QUARTER CONVENTION (all BABA metrics):
        period_type=Q1  ==  6-K period_of_report = Jun 30  (fiscal Apr-Jun)
        period_type=Q2  ==  6-K period_of_report = Sep 30  (fiscal Jul-Sep)
        period_type=Q3  ==  6-K period_of_report = Dec 31  (fiscal Oct-Dec)
        period_type=Q4  ==  reconcile-derived, anchored to 20-F period_of_report = Mar 31
                            (fiscal Jan-Mar = calendar Q1 of the next calendar year)

      BABA does NOT file a standalone 6-K for fiscal Q4; that value is
      always derived from the 20-F annual via the identity
        Q4 = FY - Q1 - Q2 - Q3     (equivalent: Q4 = FY - 9M)
      i.e. BABA's calendar-Q1 standalone revenue equals the full-year
      20-F value minus the three 6-K quarterly press releases filed in
      the preceding calendar year. The reconcile engine (`capex
      reconcile`) fires this rule automatically for revenue and
      cloud_segment_revenue. Before 2026-04-20 the cloud extractor
      emitted CALENDAR-quarter labels; a data migration relabeled the
      existing rows to the fiscal convention — see
      `scripts/relabel_baba_cloud_quarters.py` and the `audit_log`
      `period_type_relabeled` entries for the trail.

  BIDU:
    full_name: Baidu, Inc.
    category: chinese_hyperscaler
    reporting_currency: CNY
    coverage_start: "2015-01-01"
    filing_cadence:
      annual: 20-F
