# Canonical metric registry for neocloud-capex-tracker.
#
# Loaded into the metric_definitions DB table by
# capex.db.sync.sync_metric_definitions(). This file is the source of
# truth; the DB table is a queryable mirror.
#
# Keys are stable identifiers used throughout the pipeline (extractions
# FK to them). Labels are for display. Aliases are the natural-language
# phrasings the query skill uses to resolve user questions to the
# canonical key — add common variants as you encounter them.
#
# Unit conventions:
#   USD_millions   — report the value in millions of USD (e.g. 88000 = $88B)
#   USD_actual     — report the raw dollar amount (rarely used)
#   ratio          — dimensionless (e.g. capex/revenue)
#
# Adding a metric: append an entry here, then run:
#   python -m capex.cli.main db sync-metrics

metrics:

  capital_expenditures:
    label: Capital expenditures
    unit_default: USD_millions
    aliases:
      - capex
      - capital expenditure
      - capital expenditures
      - purchases of property and equipment
      - additions to property and equipment
      - purchases of property, plant and equipment
      - property and equipment additions
      - investments in property and equipment
      - "us-gaap:PaymentsToAcquirePropertyPlantAndEquipment"
    description: >
      Cash outflows for purchases of property, plant, and equipment.
      Typically reported in the investing activities section of the cash
      flow statement. This is the headline capex figure.

  depreciation_amortization:
    label: Depreciation and amortization
    unit_default: USD_millions
    aliases:
      - d&a
      - depreciation
      - depreciation and amortization
      - depreciation, amortization and accretion
      - depreciation and amortization expense
      - "us-gaap:DepreciationDepletionAndAmortization"
    description: >
      Non-cash charge reflecting the periodic expense of long-lived
      assets. Often reported alongside capex as a proxy for asset base
      turnover.

  property_plant_equipment_net:
    label: Property, plant and equipment, net
    unit_default: USD_millions
    aliases:
      - ppe
      - pp&e
      - property and equipment net
      - property, plant and equipment, net
      - net property and equipment
      - "us-gaap:PropertyPlantAndEquipmentNet"
    description: >
      Balance sheet carrying value of long-lived tangible assets after
      accumulated depreciation. The stock companion to capex (flow) and
      D&A (flow).

  revenue:
    label: Total revenue
    unit_default: USD_millions
    aliases:
      - revenue
      - total revenue
      - net revenue
      - net sales
      - total net sales
      - revenues
      - "us-gaap:Revenues"
    description: >
      Top-line revenue for the reporting period. Used as the denominator
      in the capex/revenue efficiency ratio.

  operating_cash_flow:
    label: Net cash provided by operating activities
    unit_default: USD_millions
    aliases:
      - ocf
      - operating cash flow
      - cash from operations
      - cash flow from operations
      - net cash provided by operating activities
      - net cash from operating activities
      - "us-gaap:NetCashProvidedByOperatingActivities"
    description: >
      Cash generated by the business's core operations before investing
      or financing activity. Used as the denominator in the capex/OCF
      efficiency ratio.
