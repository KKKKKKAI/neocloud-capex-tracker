[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neocloud-capex-tracker"
version = "0.0.1"
description = "Automated tracker for AI-related capex disclosures across major hyperscalers and neocloud providers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kai and contributors" }]
license = { text = "TBD" }
keywords = ["capex", "hyperscaler", "neocloud", "ai-infrastructure", "llm-extraction"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Runtime deps needed by Phase 1 (DB layer + YAML sync). Per-layer extras
# below add the heavier dependencies (SDKs, PDF parsers) only when the
# corresponding phase lands. See docs/RESTRUCTURING_PLAN.md.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pydantic>=2.0",
]
fetch = [
    "requests>=2.31",
]
read = [
    "pdfplumber",
    "pypdf",
]
extract = [
    "pydantic>=2.0",
    # model SDKs declared per adapter as backends land (Phase 3)
]
export = [
    "openpyxl>=3.1",
]

[project.scripts]
capex = "capex.cli.main:main"

[project.urls]
Repository = "https://github.com/KKKKKKAI/neocloud-capex-tracker"
Issues = "https://github.com/KKKKKKAI/neocloud-capex-tracker/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["capex*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["UP017"]  # datetime.UTC requires 3.11+; we use timezone.utc for 3.10 compat

[tool.ruff.lint.per-file-ignores]
# Standalone scripts intentionally mutate sys.path before importing capex.*.
"scripts/*.py" = ["E402"]
# Test files legitimately import modules with short aliases for legibility.
# Long SQL string literals in test setup are clearer when not split.
"tests/**/*.py" = ["N812", "E501"]
# Inline HTML strings in the email formatter are inherently wide; breaking
# them across lines hurts readability without buying anything.
"src/capex/notify/formatter.py" = ["E501"]
# Stdlib-style "Configured" exception name (no Error suffix) — intentional.
"src/capex/notify/email_sender.py" = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
